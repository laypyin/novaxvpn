name: Build PNT VPN APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate Android Project Structure & Add V2Ray
        run: |
          cp lib/main.dart /tmp/main.dart
          rm -rf lib
          flutter create --org com.pnt.vpn --project-name pnt_vpn --platforms android .
          cp /tmp/main.dart lib/main.dart
          
          flutter pub add flutter_v2ray:^1.0.8 http shared_preferences
          
          # minSdkVersion ကို 21 သို့ ပြောင်းခြင်း
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          
          # Error တွင် ညွှန်ကြားထားသည့်အတိုင်း useLegacyPackaging ကို build.gradle ထဲသို့ ထည့်သွင်းခြင်း
          cat << 'EOF' >> android/app/build.gradle
          
          android {
              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          EOF

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PNT-VPN-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
