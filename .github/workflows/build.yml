name: Build NovaX VPN APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate Project, Set NovaX Logo & Add V2Ray
        run: |
          cp lib/main.dart /tmp/main.dart
          if [ -f logo.jpg ]; then cp logo.jpg /tmp/logo.jpg; fi
          if [ -f logo.png ]; then cp logo.png /tmp/logo.jpg; fi
          
          rm -rf lib
          flutter create --org com.novax.vpn --project-name novax_vpn --platforms android .
          cp /tmp/main.dart lib/main.dart
          
          mkdir -p assets
          if [ -f /tmp/logo.jpg ]; then
            cp /tmp/logo.jpg assets/logo.jpg
          fi
          
          # V2Ray, URL Launcher နှင့် App Icon ပြောင်းသည့် Package များ ထည့်သွင်းခြင်း
          flutter pub add flutter_v2ray:^1.0.8 http shared_preferences url_launcher
          flutter pub add --dev flutter_launcher_icons
          
          # pubspec.yaml ထဲသို့ Logo လမ်းကြောင်း ထည့်သွင်းခြင်း
          cat << 'EOF' >> pubspec.yaml
          
          flutter_launcher_icons:
            android: true
            image_path: "assets/logo.jpg"
            adaptive_icon_background: "#0A0A0C"
            adaptive_icon_foreground: "assets/logo.jpg"
          EOF
          
          sed -i 's/^flutter:/flutter:\n  assets:\n    - assets\//' pubspec.yaml
          
          # လိုဂိုပုံ ရှိပါက App Icon အဖြစ် အလိုအလျောက် ပြောင်းလဲခြင်း
          if [ -f assets/logo.jpg ]; then
            dart run flutter_launcher_icons
          fi
          
          # App နာမည်ကို "NovaX VPN" သို့ ပြောင်းခြင်း
          sed -i 's/android:label="novax_vpn"/android:label="NovaX VPN"/g' android/app/src/main/AndroidManifest.xml
          
          # SDK နှင့် Packaging ပြင်ဆင်ခြင်း
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          
          cat << 'EOF' >> android/app/build.gradle
          
          android {
              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          EOF

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaX-VPN-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
